<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submit Data</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef4f8; color: #17212b; }
    main { width: min(92vw, 560px); padding: 2.5rem; background: white; border: 1px solid #d8e2e9; border-radius: 12px; box-shadow: 0 12px 30px rgba(23, 33, 43, .08); }
    h1 { margin-top: 0; }
    p { color: #52616b; }
    label { display: block; margin: 1rem 0 .35rem; font-weight: 650; }
    input, textarea { box-sizing: border-box; width: 100%; padding: .75rem; border: 1px solid #b9c8d2; border-radius: 6px; font: inherit; }
    textarea { min-height: 120px; resize: vertical; }
    button { margin-top: 1.25rem; padding: .75rem 1.2rem; border: 0; border-radius: 6px; background: #176b87; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #12566d; }
    .error { padding: .8rem; border-left: 4px solid #c0392b; background: #fff0ee; color: #8e2b20; }
    .api-link { display: inline-block; margin-top: 1.5rem; color: #176b87; }
  </style>
</head>
<body>
  <main>
    <h1>Submit your data</h1>
    <p>Complete the form to store your message in MongoDB Atlas.</p>
    {% if error %}
      <p class="error" role="alert">{{ error }}</p>
    {% endif %}
    <form action="{{ url_for('submit') }}" method="post">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" value="{{ form_data.get('name', '') if form_data else '' }}" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" value="{{ form_data.get('email', '') if form_data else '' }}" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" required>{{ form_data.get('message', '') if form_data else '' }}</textarea>

      <button type="submit">Submit data</button>
    </form>
    <a class="api-link" href="{{ url_for('api') }}">View JSON API</a>
  </main>
</body>
</html>
