<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef4f8; color: #17212b; }
    main { width: min(92vw, 560px); padding: 2.5rem; background: white; border: 1px solid #d8e2e9; border-radius: 12px; box-shadow: 0 12px 30px rgba(23, 33, 43, .08); }
    h1 { margin-top: 0; }
    p { color: #52616b; }
    label { display: block; margin: 1rem 0 .35rem; font-weight: 650; }
    input, textarea { box-sizing: border-box; width: 100%; padding: .75rem; border: 1px solid #b9c8d2; border-radius: 6px; font: inherit; }
    textarea { min-height: 120px; resize: vertical; }
    button { margin-top: 1.25rem; padding: .75rem 1.2rem; border: 0; border-radius: 6px; background: #176b87; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #12566d; }
    .back-link { display: inline-block; margin-top: 1.5rem; color: #176b87; }
  </style>
</head>
<body>
  <main>
    <h1>Create a to-do item</h1>
    <p>Add an item and describe what needs to be done.</p>
    {% if submitted %}
      <p role="status">To-do item added.</p>
    {% endif %}
    <form action="{{ url_for('todo') }}" method="post">
      <label for="item-id">Item ID</label>
      <input id="item-id" name="item_id" type="text" value="{{ form_data.get('item_id', '') if form_data else '' }}" required>
   
      <label for="item-uuid">Item UUID</label>
      <input id="item-uuid" name="item_uuid" type="text" value="{{ form_data.get('item_uuid', '') if form_data else '' }}" required>
     
      <label for="item-name">Item Name</label>
      <input id="item-name" name="item_name" type="text" value="{{ form_data.get('item_name', '') if form_data else '' }}" required>

      <label for="item-description">Item Description</label>
      <textarea id="item-description" name="item_description" required>{{ form_data.get('item_description', '') if form_data else '' }}</textarea>

      <button type="submit">Add to-do</button>
    </form>
    <a class="back-link" href="{{ url_for('index') }}">Back to data submission</a>
  </main>
</body>
</html>
